name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect skill version changes
        id: detect
        run: |
          # Get latest semver tag
          latest_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest_tag" ]; then
            echo "No existing tags found. Skipping."
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Latest tag: $latest_tag"

          bump="none"
          changes=""

          for skill_file in */skills/*/SKILL.md; do
            [ -f "$skill_file" ] || continue
            skill_name=$(echo "$skill_file" | cut -d/ -f1)

            # Current version
            current=$(sed -n '/^---$/,/^---$/p' "$skill_file" | grep -E '^\s+version:' | head -1 | sed 's/.*version:\s*"\?\([^"]*\)"\?/\1/')
            [ -z "$current" ] && continue

            # Version at latest tag (new skills won't exist)
            previous=$(git show "${latest_tag}:${skill_file}" 2>/dev/null | sed -n '/^---$/,/^---$/p' | grep -E '^\s+version:' | head -1 | sed 's/.*version:\s*"\?\([^"]*\)"\?/\1/' || echo "")

            if [ -z "$previous" ]; then
              # New skill — treat as major change
              changes="${changes}| ${skill_name} | (new) | ${current} |\n"
              bump="minor"
              continue
            fi

            [ "$current" = "$previous" ] && continue

            # Compare version components
            cur_major=$(echo "$current" | cut -d. -f1)
            cur_minor=$(echo "$current" | cut -d. -f2)
            prev_major=$(echo "$previous" | cut -d. -f1)
            prev_minor=$(echo "$previous" | cut -d. -f2)

            changes="${changes}| ${skill_name} | ${previous} | ${current} |\n"

            if [ "$cur_major" != "$prev_major" ]; then
              bump="minor"
            elif [ "$cur_minor" != "$prev_minor" ] && [ "$bump" != "minor" ]; then
              bump="patch"
            elif [ "$bump" = "none" ]; then
              bump="patch"
            fi
          done

          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

          # Write changes table to a file for the release step
          if [ -n "$changes" ]; then
            {
              echo "## Skill version changes"
              echo ""
              echo "| Skill | Previous | Current |"
              echo "|-------|----------|---------|"
              echo -e "$changes"
              echo ""
              echo "Auto-generated by the auto-release workflow."
            } > "$RUNNER_TEMP/release_notes.md"
          fi

          echo "Bump level: $bump"

      - name: Compute next version
        if: steps.detect.outputs.bump != 'none'
        id: version
        run: |
          tag="${{ steps.detect.outputs.latest_tag }}"
          bump="${{ steps.detect.outputs.bump }}"

          # Strip v prefix, split components
          ver="${tag#v}"
          major=$(echo "$ver" | cut -d. -f1)
          minor=$(echo "$ver" | cut -d. -f2)
          patch=$(echo "$ver" | cut -d. -f3)

          if [ "$bump" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          next="v${major}.${minor}.${patch}"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Create release
        if: steps.detect.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          gh release create "$NEXT_VERSION" \
            --title "$NEXT_VERSION" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            --target "$GITHUB_SHA"
