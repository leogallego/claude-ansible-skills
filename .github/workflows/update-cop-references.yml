name: Update CoP References

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 8am UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run update script
        run: ./scripts/update-cop-references.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore: update CoP reference files from upstream'
          title: 'chore: update CoP reference files from upstream'
          body: |
            Automated weekly update of AsciiDoc reference files from
            [redhat-cop/automation-good-practices](https://github.com/redhat-cop/automation-good-practices).

            This PR updates the bundled `references/*.adoc` files across all plugins.
          branch: chore/update-cop-references
          delete-branch: true
