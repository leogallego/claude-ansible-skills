name: Validate Skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Validate SKILL.md frontmatter
        run: |
          errors=0
          for skill_file in */skills/*/SKILL.md; do
            [ -f "$skill_file" ] || continue
            dir_name=$(echo "$skill_file" | cut -d/ -f3)
            plugin_dir=$(echo "$skill_file" | cut -d/ -f1)

            # Extract frontmatter block
            fm=$(sed -n '/^---$/,/^---$/p' "$skill_file" | sed '1d;$d')

            # Required fields
            for field in name description user-invocable; do
              if ! echo "$fm" | grep -qE "^${field}:"; then
                echo "::error file=${skill_file}::Missing required field: ${field}"
                errors=$((errors + 1))
              fi
            done

            # Version exists and is semver
            version=$(echo "$fm" | grep -E '^\s+version:' | head -1 | sed 's/.*version:\s*"\?\([^"]*\)"\?/\1/')
            if [ -z "$version" ]; then
              echo "::error file=${skill_file}::Missing metadata.version"
              errors=$((errors + 1))
            elif ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error file=${skill_file}::Version '${version}' is not valid semver (expected X.Y.Z)"
              errors=$((errors + 1))
            fi

            # Name matches directory
            name=$(echo "$fm" | grep -E '^name:' | head -1 | sed 's/name:\s*//')
            if [ "$name" != "$dir_name" ]; then
              echo "::error file=${skill_file}::Frontmatter name '${name}' does not match directory '${dir_name}'"
              errors=$((errors + 1))
            fi

            # Version matches plugin.json
            pjson="${plugin_dir}/.claude-plugin/plugin.json"
            if [ -f "$pjson" ]; then
              pj_version=$(grep '"version"' "$pjson" | sed 's/.*"\([0-9][^"]*\)".*/\1/')
              if [ -n "$version" ] && [ "$version" != "$pj_version" ]; then
                echo "::error file=${skill_file}::SKILL.md version '${version}' does not match plugin.json version '${pj_version}'"
                errors=$((errors + 1))
              fi
            fi

            echo "  ✓ ${skill_file} (${name} v${version})"
          done

          if [ $errors -gt 0 ]; then
            echo "::error::Frontmatter validation failed with ${errors} error(s)"
            exit 1
          fi
          echo "All SKILL.md frontmatter valid."

      - name: Validate reference file integrity
        run: |
          errors=0

          # Parse SECTION_MAP from update-cop-references.sh
          # Extract lines between declare -A SECTION_MAP and the closing )
          map_block=$(sed -n '/declare -A SECTION_MAP/,/^)/p' scripts/update-cop-references.sh)

          # Build expected mappings: section -> plugin list
          declare -A expected_refs
          while IFS= read -r line; do
            section=$(echo "$line" | sed -n 's/.*\[\([^]]*\)\]="\([^"]*\)".*/\1/p')
            plugins=$(echo "$line" | sed -n 's/.*\[\([^]]*\)\]="\([^"]*\)".*/\2/p')
            [ -z "$section" ] && continue
            IFS=',' read -ra targets <<< "$plugins"
            for plugin in "${targets[@]}"; do
              expected_refs["${plugin}:${section}"]=1
            done
          done <<< "$map_block"

          # Check every expected ref file exists
          for key in "${!expected_refs[@]}"; do
            plugin="${key%%:*}"
            section="${key##*:}"
            ref_file="${plugin}/references/${section}.adoc"
            if [ ! -f "$ref_file" ]; then
              echo "::error::Missing reference: ${ref_file} (mapped in SECTION_MAP)"
              errors=$((errors + 1))
            fi
          done

          # Check for orphan .adoc files not in any mapping
          for ref_file in */references/*.adoc; do
            [ -f "$ref_file" ] || continue
            plugin=$(echo "$ref_file" | cut -d/ -f1)
            section=$(basename "$ref_file" .adoc)
            if [ -z "${expected_refs["${plugin}:${section}"]+x}" ]; then
              echo "::warning file=${ref_file}::Orphan reference file not in SECTION_MAP"
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "::error::Reference integrity check failed with ${errors} error(s)"
            exit 1
          fi
          echo "All reference files present and accounted for."

      - name: Check marketplace drift
        run: |
          node scripts/gen-marketplace.js > /dev/null
          if ! git diff --exit-code .claude-plugin/marketplace.json */.claude-plugin/plugin.json; then
            echo "::error::marketplace.json or plugin.json out of date — run 'node scripts/gen-marketplace.js' and commit"
            exit 1
          fi
          echo "Marketplace index is up to date."

      - name: Check SKILL.md line counts
        run: |
          errors=0
          warnings=0
          for skill_file in */skills/*/SKILL.md; do
            [ -f "$skill_file" ] || continue
            lines=$(wc -l < "$skill_file")
            if [ "$lines" -gt 500 ]; then
              echo "::error file=${skill_file}::SKILL.md is ${lines} lines (max 500) — move content to references/"
              errors=$((errors + 1))
            elif [ "$lines" -gt 400 ]; then
              echo "::warning file=${skill_file}::SKILL.md is ${lines} lines (consider trimming, max 500)"
              warnings=$((warnings + 1))
            else
              echo "  ✓ ${skill_file} (${lines} lines)"
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "::error::Line count check failed — ${errors} skill(s) exceed 500 lines"
            exit 1
          fi
          if [ $warnings -gt 0 ]; then
            echo "${warnings} skill(s) approaching the 500-line limit."
          else
            echo "All SKILL.md files within line limits."
          fi

      - name: Check description quality
        run: |
          errors=0
          warnings=0

          for skill_file in */skills/*/SKILL.md; do
            [ -f "$skill_file" ] || continue
            skill_name=$(echo "$skill_file" | cut -d/ -f3)

            # Extract description value from frontmatter
            # Handles both single-line and multi-line (>- folded) descriptions
            desc=$(python3 -c "
          import yaml, sys
          with open('$skill_file') as f:
              content = f.read()
          # Extract frontmatter between --- markers
          parts = content.split('---', 2)
          if len(parts) >= 3:
              fm = yaml.safe_load(parts[1])
              if fm and 'description' in fm:
                  print(fm['description'])
          ")

            if [ -z "$desc" ]; then
              echo "::error file=${skill_file}::Could not extract description"
              errors=$((errors + 1))
              continue
            fi

            # Check for negative guidance ("Do NOT" or "Do not")
            do_not_count=$(echo "$desc" | grep -ci "do not" || true)
            if [ "$do_not_count" -eq 0 ]; then
              echo "::error file=${skill_file}::Description lacks 'Do NOT' clause — add negative guidance to prevent wrong triggers"
              errors=$((errors + 1))
            fi

            # Check word count (30-150 range)
            word_count=$(echo "$desc" | wc -w | tr -d ' ')
            if [ "$word_count" -lt 30 ]; then
              echo "::warning file=${skill_file}::Description is ${word_count} words (minimum 30) — too short for reliable triggering"
              warnings=$((warnings + 1))
            elif [ "$word_count" -gt 150 ]; then
              echo "::warning file=${skill_file}::Description is ${word_count} words (maximum 150) — too long, adds unnecessary context cost"
              warnings=$((warnings + 1))
            else
              echo "  ✓ ${skill_name}: description OK (${word_count} words, ${do_not_count} 'Do NOT' clause(s))"
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "::error::Description quality check failed with ${errors} error(s)"
            exit 1
          fi
          if [ $warnings -gt 0 ]; then
            echo "${warnings} description warning(s)."
          else
            echo "All descriptions pass quality checks."
          fi

      - name: Validate YAML examples in SKILL.md
        run: |
          errors=0
          checked=0

          for skill_file in */skills/*/SKILL.md; do
            [ -f "$skill_file" ] || continue
            skill_name=$(echo "$skill_file" | cut -d/ -f3)

            # Extract YAML fenced code blocks from the body (after frontmatter)
            # Skip the frontmatter, then find ```yaml ... ``` blocks
            body=$(sed -n '/^---$/,/^---$/d; p' "$skill_file")
            yaml_blocks=$(echo "$body" | sed -n '/^```ya\?ml$/,/^```$/{ /^```/d; p }')

            if [ -z "$yaml_blocks" ]; then
              echo "  - ${skill_name}: no YAML examples (skipped)"
              continue
            fi

            result=$(echo "$yaml_blocks" | python3 -c "
          import sys, yaml
          content = sys.stdin.read()
          try:
              list(yaml.safe_load_all(content))
              print('OK')
          except yaml.YAMLError as e:
              print(f'FAIL: {e}')
          " 2>&1)

            if echo "$result" | grep -q "^OK"; then
              checked=$((checked + 1))
              echo "  ✓ ${skill_name}: YAML examples parse correctly"
            else
              echo "::error file=${skill_file}::YAML example parse error: ${result}"
              errors=$((errors + 1))
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "::error::YAML validation failed — ${errors} skill(s) have unparseable YAML examples"
            exit 1
          fi
          echo "All YAML examples valid (${checked} skill(s) checked)."

      - name: Check cross-skill description overlap
        continue-on-error: true
        run: |
          warnings=0

          # Extract quoted trigger phrases from each skill's description
          declare -A phrase_owners
          for skill_file in */skills/*/SKILL.md; do
            [ -f "$skill_file" ] || continue
            skill_name=$(echo "$skill_file" | cut -d/ -f3)

            desc=$(python3 -c "
          import yaml, sys
          with open('$skill_file') as f:
              content = f.read()
          parts = content.split('---', 2)
          if len(parts) >= 3:
              fm = yaml.safe_load(parts[1])
              if fm and 'description' in fm:
                  print(fm['description'])
          ")

            # Extract quoted trigger phrases (e.g., "lint my role")
            phrases=$(echo "$desc" | grep -oP '"[^"]+"' | tr '[:upper:]' '[:lower:]' | sort -u)
            while IFS= read -r phrase; do
              [ -z "$phrase" ] && continue
              # Skip short connector phrases
              clean=$(echo "$phrase" | tr -d '"' | xargs)
              word_count=$(echo "$clean" | wc -w)
              [ "$word_count" -lt 2 ] && continue

              if [ -n "${phrase_owners[$phrase]+x}" ]; then
                existing="${phrase_owners[$phrase]}"
                echo "::warning::Trigger phrase ${phrase} appears in both '${existing}' and '${skill_name}'"
                warnings=$((warnings + 1))
              else
                phrase_owners[$phrase]="$skill_name"
              fi
            done <<< "$phrases"
          done

          if [ $warnings -gt 0 ]; then
            echo "${warnings} overlapping trigger phrase(s) found — consider differentiating descriptions."
          else
            echo "No overlapping trigger phrases detected."
          fi

      - name: Detect no-op patterns
        continue-on-error: true
        run: |
          warnings=0
          noop_patterns=(
            "ensure quality"
            "write clean code"
            "be thorough"
            "pay attention to"
            "high quality"
            "best possible"
            "carefully consider"
            "think carefully"
            "ensure accuracy"
            "be precise"
          )

          for skill_file in */skills/*/SKILL.md; do
            [ -f "$skill_file" ] || continue
            skill_name=$(echo "$skill_file" | cut -d/ -f3)

            # Check the body (after frontmatter) for no-op patterns
            body=$(sed -n '/^---$/,/^---$/d; p' "$skill_file")
            skill_hits=0
            for pattern in "${noop_patterns[@]}"; do
              count=$(echo "$body" | grep -ci "$pattern" || true)
              if [ "$count" -gt 0 ]; then
                echo "::warning file=${skill_file}::No-op pattern '${pattern}' found ${count} time(s) — consider removing fluff"
                skill_hits=$((skill_hits + count))
              fi
            done

            if [ $skill_hits -eq 0 ]; then
              echo "  ✓ ${skill_name}: no no-op patterns"
            else
              warnings=$((warnings + skill_hits))
            fi
          done

          if [ $warnings -gt 0 ]; then
            echo "${warnings} no-op pattern(s) found — review and remove if not load-bearing."
          else
            echo "No no-op patterns detected."
          fi

      - name: Check token estimates
        continue-on-error: true
        run: |
          skill_file="ansible-good-practices/skills/ansible-good-practices/SKILL.md"
          ref_dir="ansible-good-practices/references"

          # Map section names to .adoc files and get byte counts
          declare -A section_bytes
          for f in "${ref_dir}"/*.adoc; do
            [ -f "$f" ] || continue
            section=$(basename "$f" .adoc)
            section_bytes[$section]=$(wc -c < "$f")
          done

          # Parse token table rows (lines with | sections | number |)
          warnings=0
          while IFS='|' read -r _ files sections tokens _; do
            # Skip header and separator rows
            echo "$tokens" | grep -qE '[0-9]' || continue

            # Clean up fields
            sections=$(echo "$sections" | xargs)
            stated=$(echo "$tokens" | tr -d ', ' | xargs)
            [ -z "$stated" ] || [ "$stated" = "~Tokens(full)" ] && continue

            # Sum bytes for referenced sections
            total_bytes=0
            IFS=',' read -ra section_list <<< "$sections"
            missing=0
            for s in "${section_list[@]}"; do
              s=$(echo "$s" | xargs)
              if [ -n "${section_bytes[$s]+x}" ]; then
                total_bytes=$((total_bytes + section_bytes[$s]))
              else
                missing=1
              fi
            done

            [ $missing -eq 1 ] && continue
            [ $total_bytes -eq 0 ] && continue

            estimated=$((total_bytes / 4))
            deviation=$(( (stated - estimated) * 100 / estimated ))
            abs_deviation=${deviation#-}

            if [ "$abs_deviation" -gt 20 ]; then
              echo "::warning file=${skill_file}::Token estimate for [${sections}]: stated=${stated}, estimated=${estimated} (${deviation}% deviation)"
              warnings=$((warnings + 1))
            fi
          done < <(sed -n '/~Tokens/,/^$/p' "$skill_file" | tail -n +3)

          if [ $warnings -gt 0 ]; then
            echo "${warnings} token estimate(s) deviate by more than 20%."
          else
            echo "All token estimates within 20% tolerance."
          fi
